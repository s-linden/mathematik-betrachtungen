<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sinus und Cosinus als Ansichten einer Schraubenlinie</title>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; background: #fafafa; color: #222; }
  h1 { font-size: 1.2rem; margin: 0 0 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; align-items: center; }
  button { padding: 6px 10px; border: 1px solid #bbb; background: #fff; border-radius: 6px; cursor: pointer; }
  button:hover { background: #eee; }
  .legend span { margin-right: 14px; white-space: nowrap; }
  .sw { display: inline-block; width: 14px; height: 4px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body>
<div class="bar">
  <button onclick="view(0,0,1)">Draufsicht → Einheitskreis</button>
  <button onclick="view(1,-1.3,0.8)">Schrägansicht</button>
  <button onclick="toggle('zeigeSchraube')">Schraube ein / aus</button>
  <button onclick="toggle('zeigeProj')">Projektionen ein / aus</button>
  <button onclick="view(-1,0.001,0)">Blick entlang der 1-Achse → Sinus</button>
  <button onclick="view(-0.001,1,0)">Blick entlang der 2-Achse → Cosinus</button>
  <button onclick="saveGgb()">Als .ggb speichern</button>
</div>
<div class="bar">
  <label for="phi" style="font-family:serif;font-style:italic;font-size:1.15rem">φ</label>
  <input type="range" id="phi" min="0" max="18.85" step="0.01" value="0.5236" oninput="setPhi(this.value)" style="flex:1;min-width:160px;max-width:480px">
  <span id="phiVal" style="min-width:9em">φ = 0,52 (30°)</span>
  <button id="play" onclick="play()">▶ Abspielen</button>
</div>
<div class="bar legend">
  <span><i class="sw" style="background:#C62828"></i>Cosinus</span>
  <span><i class="sw" style="background:#1565C0"></i>Sinus</span>
  <span><i class="sw" style="background:#000000;height:5px"></i>Kreisbogen / Winkel φ</span>
  <span><i class="sw" style="background:#000000;height:2px"></i>Schraubenlinie</span>
</div>
<div id="ggb"></div>

<script>
const CMDS = [
  // Schieberegler: Winkel φ (Länge des Kreisbogens) von 0 bis 6π (drei Umdrehungen)
  "α = Slider(0, 6π, 0.01, 0.3, 300, false, true, false, false)",
  "SetValue(α, π / 6)",  // Startwinkel 30° wie in Abb. 2.1 und 2.2
  "O = (0, 0, 0)",
  // Achsen wie in Abb. 1.1: hellgrau, nur mit Namen 1, 2 (und φ nach oben), ohne Zahlen
  "a1 = Vector((-1.3, 0, 0), (1.3, 0, 0))",
  "a2 = Vector((0, -1.3, 0), (0, 1.3, 0))",
  "a3 = Vector((0, 0, 0), (0, 0, 6π + 1))",
  "n1 = Text(\"1\", (1.27, -0.15, 0))",
  "n2 = Text(\"2\", (-0.12, 1.22, 0))",
  "n3 = Text(\"φ\", (0, 0, 6π + 1.3))",
  "oTxt = Text(\"\\mathcal{O}\", (-0.12, -0.06, 0), false, true)",
  "E = (1, 0, 0)",
  "zeigeAchse3 = false",

  // --- Einheitskreis in der 1-2-Ebene ---
  "k = Curve(cos(s), sin(s), 0, s, 0, 2π)",
  "P = (cos(α), sin(α), 0)",
  "F = (cos(α), 0, 0)",
  "r = Segment(O, P)",
  "cosK = Segment(O, F)",
  "sinK = Segment(F, P)",
  "bogen = Curve(cos(s), sin(s), 0, s, 0, α)",
  // Winkel in der Ebene (nach jeder vollen Umdrehung wieder von vorn)
  "w = α - 2π floor(α / (2π))",
  "bogenTxt = Text(\"φ\", (1.1 cos(w / 2), 1.1 sin(w / 2), 0))",
  // Pfeilspitze am Ende des Kreisbogens (wie in Abb. 2.1)
  "pfeil = Vector((cos(α) + 0.08 sin(α), sin(α) - 0.08 cos(α), 0), P)",
  // rechter Winkel am Fußpunkt F und Beschriftung der Katheten (wie in Abb. 2.2)
  "ra = Polyline((cos(α) - 0.07 sgn(cos(α)), 0, 0), (cos(α) - 0.07 sgn(cos(α)), 0.07 sgn(sin(α)), 0), (cos(α), 0.07 sgn(sin(α)), 0))",
  "cosTxt = Text(\"\\cos\\varphi\", (cos(α) / 2 - 0.12, -0.08 - 0.1 sgn(sin(α)), 0), false, true)",
  "sinTxt = Text(\"\\sin\\varphi\", (cos(α) - 0.3 sgn(cos(α)) - 0.05, sin(α) / 2 + 0.05, 0), false, true)",
  "winkel = Curve(0.25 cos(s), 0.25 sin(s), 0, s, 0, w)",
  "rTxt = Text(\"r=1\", (0.5 cos(α) - 0.12 sin(α), 0.5 sin(α) + 0.12 cos(α), 0), false, true)",
  "winkelTxt = Text(\"\\varphi\", (0.36 cos(w / 2), 0.36 sin(w / 2), 0), false, true)",

  // --- dritte Dimension: Winkel φ nach oben auftragen ---
  "Z = (0, 0, α)",
  "bm = Segment(O, Z)",
  // Punkt H senkrecht über P: läuft auf der Schraubenlinie
  "H = (cos(α), sin(α), α)",
  "hoch = Segment(P, H)",
  // Cosinus und Sinus auf Höhe φ (wie das Dreieck im Einheitskreis)
  "C = (cos(α), 0, α)",
  "cosH = Segment(Z, C)",
  "sinH = Segment(C, H)",
  // Projektionen von H auf die Seitenwände
  "S = (0, sin(α), α)",
  "sinP = Segment(Z, S)",
  "hs = Segment(H, S)",
  "hc = Segment(H, C)",

  // Spuren als Kurven (bleiben beim Drehen der Ansicht erhalten)
  "schraube = Curve(cos(s), sin(s), s, s, 0, α)",
  "sinKurve = Curve(0, sin(s), s, s, 0, α)",
  "cosKurve = Curve(cos(s), 0, s, s, 0, α)",

  // Schalter: Schraube und Projektionen erst bei Bedarf einblenden
  "zeigeSchraube = false",
  "zeigeProj = false",
];

const STYLE = {
  k:        ["#000000", 2, 15],
  r:        ["#000000", 2, 0],
  cosK:     ["#C62828", 5, 0],
  pfeil:    ["#000000", 5, 0],
  ra:       ["#000000", 1, 0],
  sinK:     ["#1565C0", 5, 0],
  bogen:    ["#000000", 5, 0],
  bm:       ["#000000", 5, 0],
  hoch:     ["#000000", 1, 1],
  cosH:     ["#C62828", 2, 1],
  sinH:     ["#1565C0", 2, 1],
  sinP:     ["#1565C0", 2, 1],
  hs:       ["#1565C0", 1, 1],
  hc:       ["#C62828", 1, 1],
  schraube: ["#000000", 2, 0],
  winkel:   ["#808080", 2, 0],
  a1:       ["#BFBFBF", 2, 0],
  a2:       ["#BFBFBF", 2, 0],
  a3:       ["#BFBFBF", 2, 0],
  sinKurve: ["#1565C0", 2, 0],
  cosKurve: ["#C62828", 2, 0],
};
const POINTS = { O:"#000000", E:"#000000", P:"#000000", F:"#C62828", Z:"#000000", H:"#000000", S:"#1565C0", C:"#C62828" };
const LABELS = { P:true, H:true, S:true, C:true, α:true };

function hex(h){ return [1,3,5].map(i => parseInt(h.substr(i,2),16)); }

let api;

function build(a) {
  api = a;
  CMDS.forEach(c => api.evalCommand(c));
  for (const [n,[col,th,dash]] of Object.entries(STYLE)) {
    api.setColor(n, ...hex(col));
    api.setLineThickness(n, th);
    api.setLineStyle(n, dash);
    api.setLabelVisible(n, false);
  }
  for (const [n,col] of Object.entries(POINTS)) {
    api.setColor(n, ...hex(col));
    api.setPointSize(n, n === "H" || n === "S" || n === "C" ? 4 : 3);
    api.setLabelVisible(n, !!LABELS[n]);
    api.setFixed(n, true, false);
  }
  api.setCaption("S", "sin");
  api.setCaption("C", "cos");
  api.setLabelStyle("S", 3);
  api.setLabelStyle("C", 3);
  api.setCaption("α", "φ");
  api.setLabelStyle("α", 3);
  api.setLabelVisible("α", true);
  api.evalCommand("SetVisibleInView(α, 1, true)");
  api.setCaption("H", "$\\tilde{P}$");
  api.setLabelStyle("H", 3);
  // Winkel α in der Ebene: grau, nur zur Orientierung
  // P als Kringel wie in Abb. 1.1, (1|0) als gefüllter Punkt, Ursprung nur beschriftet
  api.setPointStyle("P", 2);
  api.setVisible("O", false);
  ["n1", "n2", "n3"].forEach(n => { api.setColor(n, 191, 191, 191); api.setFixed(n, true, false); });
  api.setColor("oTxt", 64, 64, 64);
  api.setColor("rTxt", 0, 0, 0);
  api.setColor("cosTxt", ...hex("#C62828"));
  api.setColor("sinTxt", ...hex("#1565C0"));
  ["cosTxt", "sinTxt"].forEach(n => api.setFixed(n, true, false));
  ["oTxt", "rTxt"].forEach(n => api.setFixed(n, true, false));
  api.setColor("winkelTxt", 128, 128, 128);
  api.setColor("bogenTxt", 0, 0, 0);
  // kleines kursives φ (wie in Formeln), etwas größer als normal
  api.evalXML(api.getXML("bogenTxt").replace(/<font[^>]*\/>/, "").replace("</element>", '<font serif="true" sizeM="1.4" size="0" style="2"/></element>'));
  api.setVisible("w", false);
  ["bogenTxt", "winkelTxt"].forEach(n => api.setFixed(n, true, false));

  api.setCaption("zeigeSchraube", "Schraube ein / aus");
  api.setCaption("zeigeProj", "Projektionen ein / aus");
  ["H", "hoch", "schraube", "bm", "Z"]
    .forEach(n => api.evalCommand(`SetConditionToShowObject(${n}, zeigeSchraube)`));
  ["S", "C", "cosH", "sinH", "sinP", "hs", "hc", "sinKurve", "cosKurve"]
    .forEach(n => api.evalCommand(`SetConditionToShowObject(${n}, zeigeSchraube ∧ zeigeProj)`));
  // eingebaute Achsen aus, stattdessen die eigenen hellgrauen Achsen
  api.setAxesVisible(3, false, false, false);
  ["a3", "n3"].forEach(n => api.evalCommand(`SetConditionToShowObject(${n}, zeigeAchse3)`));
  // Hochachse erscheint, sobald Schraube oder Projektionen eingeschaltet werden (auch per Kästchen)
  api.registerObjectUpdateListener("zeigeSchraube", "onToggle");
  api.registerObjectUpdateListener("zeigeProj", "onToggle");
  api.registerObjectUpdateListener("α", "onPhi");
  onPhi();
  view(0,0,1);
}

// eigener Schieberegler für φ (der GeoGebra-Schieberegler ist in der 3D-Ansicht nicht sichtbar)
function setPhi(v){ if (api) api.setValue("α", +v); }
function onPhi(){
  const v = api.getValue("α");
  document.getElementById("phi").value = v;
  const grad = Math.round(v * 180 / Math.PI);
  document.getElementById("phiVal").textContent = "φ = " + v.toFixed(2).replace(".", ",") + " (" + grad + "°)";
}
let timer = null;
function play(){
  const knopf = document.getElementById("play");
  if (timer) { clearInterval(timer); timer = null; knopf.textContent = "▶ Abspielen"; return; }
  if (api.getValue("α") >= 6 * Math.PI - 0.01) api.setValue("α", 0);
  knopf.textContent = "❚❚ Anhalten";
  timer = setInterval(() => {
    const v = api.getValue("α") + 0.02;
    if (v >= 6 * Math.PI) { api.setValue("α", 6 * Math.PI); play(); return; }
    api.setValue("α", v);
  }, 30);
}

function showHeightAxis(){ api.setValue("zeigeAchse3", true); }
function onToggle(n){ if (api.getValue(n)) showHeightAxis(); }

function view(x,y,z){
  if (!api) return;
  if (!(x === 0 && y === 0)) showHeightAxis();
  // Draufsicht: nur den Einheitskreis zeigen; sonst die ganze Höhe bis 6π
  api.evalCommand(x === 0 && y === 0 ? "ZoomIn(-1.3, -1.3, -1, 1.85, 1.35, 1)" : "ZoomIn(-2, -2, 0, 2, 2, 19)");
  api.evalCommand(`SetViewDirection(Vector((${-x}, ${-y}, ${-z})))`);
}
function toggle(n){ api.setValue(n, !api.getValue(n)); }
function saveGgb(){
  api.getBase64(b64 => {
    const a = document.createElement("a");
    a.href = "data:application/vnd.geogebra.file;base64," + b64;
    a.download = "helix-sinus-cosinus.ggb";
    a.click();
  });
}

new GGBApplet({
  appName: "3d",
  width: Math.max(500, window.innerWidth - 24),
  height: Math.max(440, window.innerHeight - 150),
  showToolBar: false,
  showAlgebraInput: true,
  showMenuBar: false,
  showKeyboardOnFocus: false,
  enableRightClick: true,
  showResetIcon: true,
  perspective: "AT",
  appletOnLoad: build
}, true).inject("ggb");
</script>
</body>
</html>

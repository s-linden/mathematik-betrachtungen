# Book settings
# Learn more at https://jupyterbook.org/customize/config.html

title: "Mathematik: Betrachtungen"
author: Sebastian Linden
copyright: "2026. Dieses Skript steht unter der CC BY-NC-SA 4.0-Lizenz"
logo: images/logo-sl.png
only_build_toc_files: true

# Force re-execution of notebooks on each build.
# See https://jupyterbook.org/content/execute.html
execute:
  execute_notebooks: force

# Information about where the book exists on the web
repository:
  url: https://github.com/s-linden/mathematik-betrachtungen  # Online location of your book
  branch: main  # Which branch of the repository should be used when creating links (optional)

# Add GitHub buttons to your book
# See https://jupyterbook.org/customize/config.html#add-a-link-to-your-repository
html:
  use_issues_button: true
  use_repository_button: true
  # GoatCounter: Seitenaufrufe (ohne Cookies)
  extra_footer: |
    <script data-goatcounter="https://s-linden.goatcounter.com/count"
            async src="//gc.zgo.at/count.js"></script>

sphinx:
  local_extensions:
    nummerierung: _ext/   # Abbildungen, Tabellen und Formeln kapitelweise nummerieren (Abb. 2.1, Tab. 6.1, (7.3))
  config:
    language: de
    html_static_path: ["_static"]
    togglebutton_hint: ""       # kein "Click to show" an aufklappbaren Kästen
    togglebutton_hint_hide: ""  # kein "Click to hide"
    numfig_format:              # Bildunterschriften "Abb. 1.1:" statt "Fig. 1"
      figure: "Abb. %s:"
      table: "Tab. %s"
    math_numfig: true           # Formelnummern kapitelweise, z. B. (2.3)
    myst_links_external_new_tab: true  # externe Links in neuem Tab öffnen
    mathjax_path: https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js
    html_css_files:
      - vernetzend.css
